name: Tests

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src tests -type f -name '*.js' -print0)

      - name: Run Node.js tests
        run: node --test tests

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Smoke-test local server
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/serve.py --port 8420 > /tmp/spacefortress-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          python3 - <<'PY'
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen

          base_url = "http://127.0.0.1:8420"
          for attempt in range(40):
              try:
                  with urlopen(f"{base_url}/", timeout=1) as response:
                      assert response.status == 200
                      assert b"SPACEFORTRESS" in response.read()
                  break
              except (AssertionError, OSError, URLError):
                  if attempt == 39:
                      raise
                  time.sleep(0.1)

          with urlopen(f"{base_url}/src/app.js", timeout=1) as response:
              assert response.status == 200
              assert response.read()

          try:
              urlopen(f"{base_url}/package.json", timeout=1)
          except HTTPError as error:
              assert error.code == 404
          else:
              raise AssertionError("server exposed a file outside its allowlist")
          PY

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build public site
        run: python3 tools/build_pages.py --output .pages-site --git-sha "$GITHUB_SHA"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .pages-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
